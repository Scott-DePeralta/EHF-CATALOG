<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>EHF Sales Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   EHF SALES ACADEMY — /training
   Same visual language as the catalog: dark, premium, B2B.
   The page is an ENGINE. Every word of training lives in
   training.json, so content changes never touch this file.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#03040d; --card:#0a0b1a; --card2:#0d0e22; --card3:#11132b;
  --line:#181a30; --line2:#242745;
  --purple:#a855f7; --purple-d:#6d28d9; --purple-l:#c084fc;
  --blue:#38bdf8; --blue-l:#7dd3fc; --neon:#00ff88; --neon-d:#00cc6a;
  --gold:#c9a84c; --gold-l:#e2c46e; --red:#ff6b6b; --amber:#fbbf24;
  --text:#e8eaf6; --muted:#8a9ac4; --dim:#4a5278;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --disp:'Bebas Neue',sans-serif; --orb:'Orbitron',sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;
  font-size:15px;line-height:1.65;min-height:100vh;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--blue-l)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--purple-l);outline-offset:2px}

.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 35% at 15% 8%,rgba(109,40,217,.2) 0%,transparent 60%),
             radial-gradient(ellipse 45% 55% at 85% 85%,rgba(0,255,136,.07) 0%,transparent 55%)}

/* ── confidentiality bar ── */
.conf{position:relative;z-index:5;background:rgba(201,168,76,.08);
  border-bottom:1px solid rgba(201,168,76,.2);padding:7px 16px;text-align:center;
  font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l)}

/* ── masthead ── */
.top{position:relative;z-index:10;padding:20px 22px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(109,40,217,.07),transparent)}
.eye{font-family:var(--orb);font-size:8px;font-weight:700;letter-spacing:.34em;
  text-transform:uppercase;color:var(--neon);margin-bottom:6px}
.wm{font-family:var(--disp);font-size:clamp(28px,5vw,42px);letter-spacing:.05em;line-height:.9}
.wm .g{background:linear-gradient(120deg,#a855f7,#38bdf8 50%,#00ff88);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top .sp{flex:1}
.who{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}
.who b{display:block;color:#fff;font-size:14px;font-weight:700}
.signout{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:8px;
  padding:6px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:6px}
.signout:hover{color:var(--text);border-color:var(--muted)}

.wrap{position:relative;z-index:5;max-width:860px;margin:0 auto;padding:24px 18px 100px}

/* ── progress ── */
.prog-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 24px;margin-bottom:18px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prog-pct{font-family:var(--orb);font-size:40px;font-weight:900;line-height:1;
  background:linear-gradient(120deg,#38bdf8,#c084fc,#fff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.prog-lbl{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.prog-track{height:10px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#a855f7,#00ff88);
  transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-sub{font-size:12.5px;color:var(--muted)}
.cert{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border-radius:99px;
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid}
.cert.no{background:rgba(255,255,255,.03);color:var(--dim);border-color:var(--line2)}
.cert.on{background:rgba(0,255,136,.09);color:var(--neon);border-color:rgba(0,255,136,.3)}
.cert.go{background:rgba(201,168,76,.1);color:var(--gold-l);border-color:rgba(201,168,76,.35)}

.sec-h{font-family:var(--orb);font-size:11px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--purple-l);margin:26px 0 12px}

/* ── level list ── */
.lv{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;margin-bottom:9px;transition:.18s;width:100%;text-align:left;
  color:inherit}
.lv:hover{border-color:rgba(168,85,247,.4);transform:translateY(-1px)}
.lv-n{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--orb);font-weight:900;font-size:14px;border:2px solid var(--line2);color:var(--dim)}
.lv.done .lv-n{background:rgba(0,255,136,.12);border-color:rgba(0,255,136,.45);color:var(--neon)}
.lv.now .lv-n{background:rgba(168,85,247,.16);border-color:var(--purple);color:var(--purple-l)}
.lv-b{flex:1;min-width:0}
.lv-t{font-size:15.5px;font-weight:700;color:#fff}
.lv-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.lv-r{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.lv.done .lv-r{color:var(--neon)}
.lv.locked{opacity:.45}

/* ── toolkit ── */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tool{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:14px 13px;
  text-align:center;text-decoration:none;color:var(--text);transition:.16s;display:block}
.tool:hover{border-color:var(--purple);background:rgba(168,85,247,.08);transform:translateY(-2px)}
.tool-i{font-size:22px;display:block;margin-bottom:6px}
.tool-t{font-size:12px;font-weight:700}

/* ── script boxes ── */
.script{background:linear-gradient(135deg,rgba(56,189,248,.09),rgba(168,85,247,.07));
  border:1px solid rgba(56,189,248,.3);border-radius:13px;padding:16px 18px}
.script-t{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blue-l);margin-bottom:8px}
.script-q{font-size:16.5px;line-height:1.7;color:#fff;font-weight:400;font-style:italic}

/* ── product category card ── */
.cat{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:17px 18px}
.cat-n{font-family:var(--disp);font-size:24px;letter-spacing:.04em;color:#fff;margin-bottom:11px}
.cat-r{display:flex;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.cat-r:first-of-type{border-top:0}
.cat-r>span{flex:0 0 112px;font-size:9.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);padding-top:3px}
.cat-r>div{flex:1;font-size:14.5px;color:#d7dcf0;line-height:1.6}

/* ── status rows — never colour alone ── */
.st{display:flex;gap:13px;align-items:flex-start;border-radius:12px;padding:13px 15px;
  margin-bottom:8px;border:1px solid}
.st-m{flex:0 0 26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:14px}
.st-b b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.st-b span{font-size:14.5px;color:#d7dcf0;line-height:1.6}
.st-g{background:rgba(0,255,136,.06);border-color:rgba(0,255,136,.3)}
.st-g .st-m{background:rgba(0,255,136,.16);color:var(--neon)} .st-g b{color:var(--neon)}
.st-y{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.33)}
.st-y .st-m{background:rgba(251,191,36,.18);color:var(--amber)} .st-y b{color:var(--amber)}
.st-r{background:rgba(255,107,107,.06);border-color:rgba(255,107,107,.32)}
.st-r .st-m{background:rgba(255,107,107,.16);color:var(--red)} .st-r b{color:var(--red)}

/* ── payment notification mock ── */
.notify{background:var(--card3);border:1px solid rgba(0,255,136,.3);border-radius:13px;
  padding:16px 18px;font-family:var(--orb);font-size:13px;line-height:2;color:#d7dcf0}
.notify-h{font-weight:900;color:var(--neon);letter-spacing:.12em;margin-bottom:6px}

/* ── objection cards ── */
.card-o{background:var(--card2);border:1px solid var(--line2);border-radius:13px;
  margin-bottom:9px;overflow:hidden}
.card-q{width:100%;background:none;border:0;color:#fff;padding:15px 17px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15.5px;
  font-weight:600;line-height:1.5;min-height:52px}
.card-q:hover{background:rgba(168,85,247,.07)}
.card-x{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--purple-l);white-space:nowrap}
.card-a:not(:empty){padding:0 17px 16px}

/* ── calculators ── */
.calc{background:var(--card2);border:1px solid rgba(201,168,76,.28);border-radius:14px;padding:18px 19px}
.calc-t{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-l);margin-bottom:5px}
.calc-f{font-family:var(--orb);font-size:14px;color:#fff;margin-bottom:14px;letter-spacing:.02em}
.calc-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.calc-row label{flex:1;min-width:150px;font-size:13.5px;color:var(--muted)}
.calc-row input{flex:0 0 120px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;
  padding:11px 13px;color:#fff;font-family:var(--orb);font-size:15px;text-align:right;min-height:44px}
.calc-row input:focus{border-color:var(--gold);outline:none}
.calc-n{font-size:11.5px;color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.calc-out{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.calc-sum{font-size:13.5px;color:var(--muted);line-height:1.8}
.calc-sum b{color:#fff}
.calc-big{font-family:var(--orb);font-size:34px;font-weight:900;margin-top:8px;
  background:linear-gradient(120deg,var(--gold-l),#fff9c4);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.calc-warn{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);border-radius:9px;
  padding:10px 13px;font-size:13.5px;color:#ffc9c9;margin-bottom:12px}
.calc-ok{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.3);border-radius:9px;
  padding:10px 13px;font-size:13.5px;color:#b8ffd9;margin-bottom:12px}

.copybox{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:12px;color:#d7dcf0;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}

/* ── federal change notice ── */
.fed{background:linear-gradient(135deg,rgba(255,107,107,.1),rgba(251,191,36,.07));
  border:1px solid rgba(255,107,107,.35);border-radius:14px;padding:18px 19px}
.fed-t{font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--red);margin-bottom:12px}
.fed-r{display:flex;gap:13px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.fed-r:first-of-type{border-top:0}
.fed-r b{flex:0 0 150px;font-size:13px;color:#fff;font-weight:800;line-height:1.5}
.fed-r span{flex:1;font-size:14px;color:#d7dcf0;line-height:1.65}
.fed-f{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
  font-size:13px;color:var(--muted);line-height:1.7}
@media(max-width:620px){.fed-r{flex-direction:column;gap:3px}.fed-r b{flex:none}}

/* ── annotated COA ── */
.coa{background:#07080f;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.coa-h{padding:15px 17px;background:var(--card3);border-bottom:1px solid var(--line2)}
.coa-h b{display:block;font-size:15.5px;color:#fff;margin-bottom:5px}
.coa-h span{display:block;font-size:11.5px;color:var(--muted);line-height:1.7}
.coa-b{padding:4px 0}
.coa-r{padding:11px 17px;border-bottom:1px solid rgba(255,255,255,.04);
  display:grid;grid-template-columns:1fr auto;gap:4px 14px}
.coa-r.key{background:rgba(201,168,76,.07);border-left:3px solid var(--gold)}
.coa-n b{font-size:14.5px;color:#fff;font-weight:700}
.coa-n span{display:block;font-size:11.5px;color:var(--dim)}
.coa-v{font-family:var(--orb);font-size:16px;font-weight:700;color:var(--gold-l);text-align:right;
  white-space:nowrap}
.coa-v span{display:block;font-size:11px;color:var(--dim);font-weight:400}
.coa-note{grid-column:1/-1;font-size:13px;color:var(--blue-l);line-height:1.6;
  padding-top:5px;font-style:italic}
.coa-miss{padding:15px 17px;background:rgba(255,107,107,.06);border-top:1px solid rgba(255,107,107,.25)}
.coa-miss b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);margin-bottom:9px}
.coa-miss>span{display:inline-block;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);
  border-radius:99px;padding:4px 11px;margin:0 5px 5px 0;font-size:12px;color:#ffc9c9}
.coa-miss .coa-note{color:#ffc9c9;font-style:normal}

/* ── the just-closed checklist ── */
.ck{display:flex;flex-direction:column;gap:8px}
.ck-r{display:flex;gap:13px;align-items:flex-start;background:var(--card2);
  border:1px solid var(--line2);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s}
.ck-r:hover{border-color:rgba(168,85,247,.4)}
.ck-r input{flex:0 0 22px;width:22px;height:22px;margin-top:1px;accent-color:#00ff88;cursor:pointer}
.ck-r>span{flex:1}
.ck-r b{display:block;font-size:15px;color:#fff;font-weight:700;margin-bottom:3px;line-height:1.45}
.ck-r b+span{font-size:14px;color:#d7dcf0;line-height:1.65}
.ck-r:has(input:checked){background:rgba(0,255,136,.055);border-color:rgba(0,255,136,.3)}
.ck-r:has(input:checked) b{color:var(--neon);text-decoration:line-through;text-decoration-color:rgba(0,255,136,.45)}
.ck-no{cursor:default;background:rgba(255,255,255,.025)}
.ck-no:hover{border-color:var(--line2)}
.ck-d{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line2);margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.ck-d::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--dim)}

/* ── the two tests ── */
.tests{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tst{border-radius:13px;padding:16px 17px;border:1px solid}
.tst-now{background:rgba(0,255,136,.055);border-color:rgba(0,255,136,.3)}
.tst-next{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.3)}
.tst-h{font-family:var(--orb);font-size:15px;font-weight:700;color:#fff;margin-bottom:3px}
.tst-s{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:10px}
.tst-now .tst-s{color:var(--neon)} .tst-next .tst-s{color:var(--blue-l)}
.tst-b{font-size:14px;line-height:1.7;color:#d7dcf0}
@media(max-width:620px){.tests{grid-template-columns:1fr}}

/* ── cannabinoid rows ── */
.cn{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.cn-h b{font-family:var(--orb);font-size:15px;color:#fff;font-weight:700}
.cn-h span{font-size:12px;color:var(--dim);margin-left:9px}
.cn-w{font-size:14.5px;color:#d7dcf0;line-height:1.65;margin:7px 0}
.cn-u{font-size:13.5px;color:var(--muted);line-height:1.6;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.05)}
.cn-u span{display:block;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:3px}

/* ── sources ── */
.src{display:flex;gap:14px;background:var(--card2);border:1px solid var(--line2);
  border-radius:12px;padding:15px 17px;margin-bottom:9px}
.src-n{flex:0 0 28px;height:28px;border-radius:8px;background:rgba(168,85,247,.16);
  border:1px solid rgba(168,85,247,.35);color:var(--purple-l);display:flex;align-items:center;
  justify-content:center;font-family:var(--orb);font-weight:900;font-size:13px}
.src-b{flex:1}
.src-b>b{font-size:15.5px;color:#fff}
.src-w{display:block;font-family:var(--mono,monospace);font-size:12px;color:var(--blue-l);margin-top:2px}
.src-d{font-size:14px;color:#d7dcf0;line-height:1.65;margin-top:7px}
.src-l{display:inline-block;margin-top:8px;font-size:12px;font-weight:700}
button.cert{cursor:pointer}


/* ── lesson view ── */
.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 24px 22px}
.lesson h2{font-family:var(--disp);font-size:32px;letter-spacing:.04em;line-height:1.05;margin-bottom:4px}
.lesson .crumb{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--purple-l);margin-bottom:10px}
.blk{margin:16px 0}
.blk p{font-size:15.5px;line-height:1.75;color:#d7dcf0}
.blk b{color:#fff;font-weight:700}
.blk ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.blk li{padding-left:22px;position:relative;font-size:15px;color:#d7dcf0;line-height:1.65}
.blk li::before{content:'';position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:50%;
  background:var(--purple)}
.flow{display:flex;flex-direction:column;gap:0;margin:6px 0}
.flow-i{background:var(--card3);border:1px solid var(--line2);border-radius:10px;padding:11px 15px;
  font-weight:600;font-size:14.5px;text-align:center}
.flow-a{text-align:center;color:var(--purple);font-size:17px;line-height:1.1;padding:3px 0}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:13px;align-items:flex-start}
.step-n{flex:0 0 26px;height:26px;border-radius:7px;background:rgba(168,85,247,.16);
  border:1px solid rgba(168,85,247,.35);color:var(--purple-l);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;letter-spacing:.04em;margin-top:2px}
.step-b b{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--blue-l);margin-bottom:2px}
.step-b span{font-size:14.5px;color:#d7dcf0}
.box{border-radius:12px;padding:15px 17px;border:1px solid;font-size:14.5px;line-height:1.7}
.box-t{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}
.box.rem{background:rgba(0,255,136,.055);border-color:rgba(0,255,136,.28)}
.box.rem .box-t{color:var(--neon)}
.box.nev{background:rgba(255,107,107,.06);border-color:rgba(255,107,107,.3)}
.box.nev .box-t{color:var(--red)}
.box.rate{background:rgba(201,168,76,.07);border-color:rgba(201,168,76,.3)}
.box.rate .box-t{color:var(--gold-l)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.two-c{border-radius:12px;padding:14px 15px;border:1px solid}

/* ── buttons ── */

/* ── gate ── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;z-index:10}
#gate .box2{background:var(--card);border:1px solid rgba(168,85,247,.4);border-radius:20px;
  padding:42px 34px;max-width:420px;width:100%;text-align:center;

</style></head><body>
<div class="glow"></div>
<div class="conf">Confidential &amp; Proprietary · Exclusive Hemp Farms · Internal Use Only</div>

<div id="gate">
  <div class="box2">
    <div class="eye">Exclusive Hemp Farms</div>
    <div class="wm"><span class="g">SALES<br>ACADEMY</span></div>
    <input id="code" placeholder="Your access code" autocomplete="off"
      onkeydown="if(event.key==='Enter')signIn()">
    <button class="btn full" style="margin-top:13px" onclick="signIn()">Sign in</button>
    <div class="err" id="err"></div>
    <div class="hint">Use the same access code you use for the invoice form.<br>
      No second account, no second password.</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div>
      <div class="eye">Exclusive Hemp Farms</div>
      <div class="wm"><span class="g">SALES ACADEMY</span></div>
    </div>
    <span class="sp"></span>
    <div class="who"><b id="whoName">—</b><span id="whoSub"></span>
      <button class="signout" onclick="signOut()">Sign out</button></div>
  </div>
  <div class="wrap" id="view"></div>
</div>
<div id="toast"></div>
<script src="/training.json.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   EHF SALES ACADEMY — the engine.
   No training copy lives here. Everything comes from TRAINING,
   loaded from training.json.js, so content edits never touch code.
   ══════════════════════════════════════════════════════════════ */
var EXEC='https://script.google.com/macros/s/AKfycbw_3jfvJY1Y2UVXs_XODHDbUMTNzB36kwraR_UZle-l8Rq94pHB_qEgo4DPxsvR-D22fg/exec';
var CODE='', ME=null, ROWS={}, VIEW={name:'home'};
var PASS=80;   // a level's quiz must reach this to count as complete

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m;
  t.classList.add('up'); setTimeout(function(){ t.classList.remove('up'); },2800); }
function levels(){ return (typeof TRAINING!=='undefined' && TRAINING.levels) ? TRAINING.levels : []; }

function call(action, extra, done, fail){
  fetch(EXEC,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action:action, code:CODE}, extra||{})) })
  .then(function(r){ return r.json(); }).then(done)
  .catch(function(e){ (fail||function(){ toast('Could not reach the server.'); })(e); });
}

/* ── sign in ─────────────────────────────────────────────────── */
function signIn(){
  CODE=(document.getElementById('code').value||'').trim();
  if(!CODE){ document.getElementById('err').textContent='Enter your access code.'; return; }
  document.getElementById('err').textContent='Checking…';
  call('trainWhoAmI', {}, function(w){
    if(!w||!w.ok){ document.getElementById('err').textContent=w?w.msg:'Could not sign you in.'; return; }
    ME=w; ROWS=w.rows||{};
    // Remembered for this tab only. Closing it signs them out, which is the
    // right default on a shop counter or a shared laptop.
    try{ sessionStorage.setItem('ehf_train', CODE); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('whoName').textContent=w.name;
    document.getElementById('whoSub').textContent=w.isAdmin?'Owner':('Commission '+w.commissionPct+'%');
    go({name:'home'});
  }, function(){ document.getElementById('err').textContent='Could not reach the server.'; });
}
function signOut(){
  try{ sessionStorage.removeItem('ehf_train'); }catch(e){}
  location.reload();
}
(function resume(){
  var c=null; try{ c=sessionStorage.getItem('ehf_train'); }catch(e){}
  if(!c) return;
  document.getElementById('code').value=c;
  signIn();
})();

/* ── progress maths ──────────────────────────────────────────── */
function lvDone(l){ var r=ROWS[l.id]; return !!(r && r.status==='complete'); }
function lvScore(l){ var r=ROWS[l.id]; return r?r.score:0; }
function pctDone(){
  var L=levels(); if(!L.length) return 0;
  return Math.round(L.filter(lvDone).length / L.length * 100);
}
function nextLevel(){
  var L=levels();
  for(var i=0;i<L.length;i++) if(!lvDone(L[i])) return L[i];
  return null;
}
function certState(){
  var L=levels();
  if(!L.length) return 'none';
  var done=L.filter(lvDone).length;
  if(finalPassed()) return 'certified';
  if(done===0) return 'none';
  if(done<L.length) return 'training';
  return 'ready';          // every level done, final test still to sit
}

/* ── router ──────────────────────────────────────────────────── */
function go(v){ VIEW=v; window.scrollTo(0,0); render(); }
function render(){
  var v=document.getElementById('view');
  if(VIEW.name==='home')   v.innerHTML=homeHTML();
  if(VIEW.name==='level')  v.innerHTML=levelHTML(VIEW.id);
  if(VIEW.name==='quiz')   { v.innerHTML=quizHTML(VIEW.id); QSTATE={}; }
  if(VIEW.name==='cert')   v.innerHTML=certHTML();
  if(VIEW.name==='kit')    v.innerHTML=kitHTML(VIEW.id);
  if(VIEW.name==='final')  { v.innerHTML=finalHTML(); FSTATE={}; }
  if(VIEW.name==='closed') v.innerHTML=closedHTML();
  if(VIEW.name==='kit' && VIEW.id==='obj')     v.innerHTML=objHTML();
  if(VIEW.name==='kit' && VIEW.id==='sources') v.innerHTML=sourcesHTML();
  try{ if(document.getElementById('uOut')) calcUnits(); }catch(e){}
  // Calculators are inert markup until their first run, so a rep sees a
  // worked example rather than an empty box.
  try{ if(document.getElementById('cTHCout')) calcTHC();
       if(document.getElementById('kOut'))    calcComm(); }catch(e){}
}
</script>
<script>
/* ── THE DASHBOARD ───────────────────────────────────────────── */
function homeHTML(){
  var L=levels(), pct=pctDone(), nx=nextLevel(), cs=certState();
  var certCls = cs==='certified'?'on':((cs==='training'||cs==='ready')?'go':'no');
  var certTxt = cs==='certified'?'✓ Certified'
              : cs==='ready'    ?'Ready for the final test'
              : cs==='training' ?'In training' : 'Not started';

  var tools=[
    ['📖','Live catalog','/','ext'],
    ['🧾','Invoice','/invoice','ext'],
    ['✅','Just closed?','closed'],
    ['📞','Call script','script'],
    ['💬','Objections','obj'],
    ['📚','Sources','sources'],
    ['🔬','COA guide','coa'],
    ['🧮','Commission','calc'],
    ['📋','Lead tracker','tracker'],
    ['⚖️','Compliance','compliance']
  ];

  return (
  '<div class="prog-card">'+
    '<div class="prog-top">'+
      '<div><div class="prog-lbl">Training progress</div>'+
        '<div class="prog-pct">'+pct+'%</div></div>'+
      '<div style="text-align:right"><div class="prog-lbl">Levels</div>'+
        '<div style="font-family:var(--orb);font-size:19px;font-weight:700;color:#fff">'+
          L.filter(lvDone).length+' / '+L.length+'</div></div>'+
    '</div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="prog-sub">'+(nx
      ? ('Next up: <b style="color:#fff">Level '+nx.n+' — '+esc(nx.title)+'</b>')
      : 'Every level finished. Nicely done.')+'</div>'+
    '<button class="cert '+certCls+'" onclick="go({name:\'cert\'})">'+certTxt+' &rsaquo;</button>'+
    (nx?('<div style="margin-top:16px"><button class="btn full" onclick="go({name:\'level\',id:\''+
      nx.id+'\'})">'+(pct?'Continue training':'Start training')+'</button></div>'):'')+
  '</div>'+

  '<div class="prog-card" style="padding:18px 22px">'+
    '<div class="prog-lbl">Your 30-day mission</div>'+
    '<div style="font-size:15.5px;color:#d7dcf0;margin-top:7px;line-height:1.7">'+
      'Become competent and close <b style="color:#fff">at least 2–3 paid sales</b>.'+
      '<br><span style="font-size:13px;color:var(--muted)">A target to aim at, not a test you fail. '+
      'Nothing locks if you miss it.</span></div>'+
  '</div>'+

  '<div class="sec-h">Levels</div>'+
  L.map(function(l){
    var done=lvDone(l), isNext=(nx&&nx.id===l.id);
    return '<button class="lv '+(done?'done':(isNext?'now':''))+'" '+
      'onclick="go({name:\'level\',id:\''+l.id+'\'})">'+
      '<span class="lv-n">'+(done?'✓':l.n)+'</span>'+
      '<span class="lv-b"><span class="lv-t">'+esc(l.title)+'</span>'+
        '<span class="lv-s">'+esc(l.blurb)+'</span></span>'+
      '<span class="lv-r">'+(done?(lvScore(l)+'%'):(l.mins+' min'))+'</span></button>';
  }).join('')+

  '<div class="sec-h">Sales toolkit</div>'+
  '<div class="tools">'+tools.map(function(t){
    return t[3]==='ext'
      ? ('<a class="tool" href="'+t[2]+'" target="_blank" rel="noopener">'+
         '<span class="tool-i">'+t[0]+'</span><span class="tool-t">'+t[1]+' &#8599;</span></a>')
      : ('<button class="tool" onclick="go({name:\'kit\',id:\''+t[2]+'\'})">'+
         '<span class="tool-i">'+t[0]+'</span><span class="tool-t">'+t[1]+'</span></button>');
  }).join('')+'</div>'+
  (ME&&ME.isAdmin?('<div class="sec-h">Owner</div>'+
    '<button class="btn ghost full" onclick="everyone()">See everyone\'s progress</button>'):'')
  );
}

/* ── A LEVEL: all its lessons, then the quiz ─────────────────── */
function levelHTML(id){
  var L=levels(), l=L.filter(function(x){ return x.id===id; })[0];
  if(!l) return '<div class="none">That level is not in the content file.</div>';
  var i=L.indexOf(l), prev=L[i-1], next=L[i+1];

  return '<div class="lesson">'+
    '<div class="crumb">Level '+l.n+' · '+l.lessons.length+' lessons · about '+l.mins+' min</div>'+
    '<h2>'+esc(l.title)+'</h2>'+
    '<div class="blk"><p style="color:var(--muted)">'+esc(l.blurb)+'</p></div>'+
    l.lessons.map(function(ls,n){
      return '<div style="margin-top:26px;padding-top:22px;'+
        (n?'border-top:1px solid var(--line)':'')+'">'+
        '<div class="crumb" style="color:var(--blue-l)">'+esc(ls.title)+'</div>'+
        ls.blocks.map(block).join('')+'</div>';
    }).join('')+
    '<div class="nav">'+
      '<button class="btn ghost" onclick="go({name:\'home\'})">All levels</button>'+
      '<button class="btn" onclick="go({name:\'quiz\',id:\''+l.id+'\'})">'+
        (lvDone(l)?'Retake the quiz':'Take the quiz')+'</button>'+
    '</div>'+
  '</div>';
}

/* ── BLOCK RENDERERS — one per content type ──────────────────── */
function block(b){
  if(b.t==='text')    return '<div class="blk"><p>'+b.v+'</p></div>';
  if(b.t==='bullets') return '<div class="blk"><ul>'+b.v.map(function(x){
                               return '<li>'+x+'</li>'; }).join('')+'</ul></div>';
  if(b.t==='flow')    return '<div class="blk"><div class="flow">'+b.v.map(function(x,i){
                               return (i?'<div class="flow-a">↓</div>':'')+
                                 '<div class="flow-i">'+esc(x)+'</div>'; }).join('')+'</div></div>';
  if(b.t==='steps')   return '<div class="blk"><div class="steps">'+b.v.map(function(s,i){
                               return '<div class="step"><span class="step-n">'+(i+1)+'</span>'+
                                 '<span class="step-b"><b>'+esc(s[0])+'</b><span>'+s[1]+'</span></span></div>';
                             }).join('')+'</div></div>';
  if(b.t==='remember')return '<div class="blk"><div class="box rem">'+
                               '<div class="box-t">Remember this</div>'+b.v+'</div></div>';
  if(b.t==='never')   return '<div class="blk"><div class="box nev">'+
                               '<div class="box-t">Never say this</div>'+b.v+'</div></div>';
  if(b.t==='rate')    return '<div class="blk"><div class="box rate">'+
                               '<div class="box-t">Your rate</div>'+
                               (ME?('You are on <b style="font-size:20px;font-family:var(--orb)">'+
                                 ME.commissionPct+'%</b> of the product-only subtotal.'):b.v)+
                             '</div></div>';
  if(b.t==='two')     return '<div class="blk"><div class="two">'+
                               '<div class="two-c g"><div class="two-h">Sell this</div><ul>'+
                                 b.v.good.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>'+
                               '<div class="two-c b"><div class="two-h">Don\'t reduce us to this</div><ul>'+
                                 b.v.bad.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>'+
                             '</div></div>';
  if(b.t==='script') return blkScript(b.v);
  if(b.t==='cat')    return blkCat(b.v);
  if(b.t==='status') return blkStatus(b.v);
  if(b.t==='link')   return blkLink(b.v);
  if(b.t==='notify') return blkNotify(b.v);
  if(b.t==='cards')  return blkCards(b.v);
  if(b.t==='calc')   return blkCalc(b.v);
  if(b.t==='fed')    return blkFed();
  if(b.t==='coa')    return blkCOA();
  if(b.t==='tests')  return blkTests();
  if(b.t==='units')  return blkUnits();
  if(b.t==='cann')   return blkCann(b.v);
  if(b.t==='try'){
    var id='try'+Math.random().toString(36).slice(2,8);
    TRY[id]=b;
    // The content file is ours and uses <b> for emphasis, exactly as every other
    // block does. Escaping it here printed the tags on screen as text.
    return '<div class="q" id="'+id+'"><div class="q-t">Try it</div>'+
      '<div class="q-q">'+b.v+'</div>'+
      b.answers.map(function(a,i){
        return '<button class="opt" onclick="tryPick(\''+id+'\','+i+')">'+
          '<span class="mk">'+'ABCDEF'.charAt(i)+'</span>'+a+'</button>';
      }).join('')+'<div class="whyslot"></div></div>';
  }
  return '';
}
var TRY={};
function tryPick(id, i){
  var b=TRY[id], el=document.getElementById(id);
  if(!b||!el) return;
  var opts=el.querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){
    opts[k].disabled=true;
    if(k===b.right) opts[k].classList.add('right');
    else if(k===i)  opts[k].classList.add('wrong');
  }
  el.querySelector('.whyslot').innerHTML='<div class="why"><b>'+
    (i===b.right?'That\'s the one. ':'Not quite. ')+'</b>'+b.why+'</div>';
}
</script>
<script>
/* ── THE QUIZ ────────────────────────────────────────────────── */
var QSTATE={};
function quizHTML(id){
  var l=levels().filter(function(x){ return x.id===id; })[0];
  if(!l) return '<div class="none">Level not found.</div>';
  return '<div class="lesson">'+
    '<div class="crumb">Level '+l.n+' quiz · '+l.quiz.length+' questions · '+PASS+'% to pass</div>'+
    '<h2>'+esc(l.title)+'</h2>'+
    '<div class="blk"><p style="color:var(--muted)">Answer each one. You will see straight away '+
      'whether it was right and <b>why</b>. Retake it as often as you like — '+
      'your best score is the one that is kept.</p></div>'+
    l.quiz.map(function(q,i){
      return '<div class="q" id="q'+i+'"><div class="q-t">Question '+(i+1)+' of '+l.quiz.length+'</div>'+
        // Same as the try-it blocks: the content file uses <b> for emphasis.
        '<div class="q-q">'+q.q+'</div>'+
        q.a.map(function(a,k){
          return '<button class="opt" onclick="pick(\''+id+'\','+i+','+k+')">'+
            '<span class="mk">'+'ABCDEF'.charAt(k)+'</span>'+a+'</button>';
        }).join('')+'<div class="whyslot"></div></div>';
    }).join('')+
    '<div id="qresult"></div>'+
    '<div class="nav">'+
      '<button class="btn ghost" onclick="go({name:\'level\',id:\''+id+'\'})">Back to the lesson</button>'+
      '<button class="btn" id="qdone" disabled onclick="finish(\''+id+'\')">Finish</button>'+
    '</div></div>';
}

function pick(levelId, qi, ki){
  if(QSTATE[qi]!==undefined) return;          // answered already
  var l=levels().filter(function(x){ return x.id===levelId; })[0];
  var q=l.quiz[qi], el=document.getElementById('q'+qi);
  QSTATE[qi]=ki;
  var opts=el.querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){
    opts[k].disabled=true;
    if(k===q.right) opts[k].classList.add('right');
    else if(k===ki) opts[k].classList.add('wrong');
  }
  el.querySelector('.whyslot').innerHTML='<div class="why"><b>'+
    (ki===q.right?'Correct. ':'Not quite. ')+'</b>'+q.why+'</div>';

  // Enable Finish only when every question has been answered.
  if(Object.keys(QSTATE).length===l.quiz.length){
    var b=document.getElementById('qdone'); if(b) b.disabled=false;
    var sc=scoreOf(l);
    document.getElementById('qresult').innerHTML=
      '<div class="box '+(sc>=PASS?'rem':'nev')+'" style="margin-top:18px">'+
      '<div class="box-t">'+(sc>=PASS?'Passed':'Not yet')+'</div>'+
      '<b style="font-family:var(--orb);font-size:26px">'+sc+'%</b> — '+
      (sc>=PASS ? 'that counts as complete. Press Finish to save it.'
                : 'you need '+PASS+'% to complete this level. Press Finish to save the attempt, '+
                  'then read back through and try again. Nobody is counting the retakes.')+
      '</div>';
  }
}
function scoreOf(l){
  var right=0;
  l.quiz.forEach(function(q,i){ if(QSTATE[i]===q.right) right++; });
  return Math.round(right / l.quiz.length * 100);
}

function finish(id){
  var l=levels().filter(function(x){ return x.id===id; })[0];
  var sc=scoreOf(l);
  var b=document.getElementById('qdone'); b.disabled=true; b.textContent='Saving…';
  call('trainSave', { moduleId:id, status:(sc>=PASS?'complete':'failed'), score:sc },
    function(r){
      if(!r||!r.ok){ b.disabled=false; b.textContent='Finish';
        return toast(r&&r.msg?r.msg:'Could not save that. Your answers are still on screen.'); }
      ROWS=r.rows||ROWS;
      toast(sc>=PASS ? ('Level '+l.n+' complete — '+sc+'%') : ('Attempt saved — '+sc+'%'));
      go({name:'home'});
    },
    function(){ b.disabled=false; b.textContent='Finish';
      toast('Could not reach the server — nothing was saved. Try Finish again.'); });
}

/* ── OWNER: everyone's progress ──────────────────────────────── */
function everyone(){
  var v=document.getElementById('view');
  v.innerHTML='<div class="none">Loading…</div>';
  call('trainEveryone', {}, function(r){
    if(!r||!r.ok) return v.innerHTML='<div class="none">'+(r?esc(r.msg):'Could not load')+'</div>';
    var rows=r.rows||[];
    v.innerHTML='<div class="lesson"><div class="crumb">Owner</div><h2>Who is trained</h2>'+
      (rows.length
        ? rows.map(function(x){
            return '<div class="lv" style="cursor:default">'+
              '<span class="lv-n" style="font-size:12px">'+x.done+'</span>'+

                (x.avg?(' · average '+x.avg+'%'):'')+'</span></span>'+
              '<span class="lv-r">'+esc(x.last||'—')+'</span></div>';
          }).join('')
        : '<div class="none">Nobody has started yet.</div>')+
      '<div class="nav"><button class="btn ghost" onclick="go({name:\'home\'})">Back</button></div></div>';
  });
}

<script>
/* ── THE REMAINING BLOCK TYPES ───────────────────────────────── */

/* A script a rep says out loud. Visually distinct because these are the
   sentences they will reuse on real calls. */
function blkScript(v){
  return '<div class="blk"><div class="script">'+
    '<div class="script-t">Say this</div>'+
    '<div class="script-q">&ldquo;'+esc(v)+'&rdquo;</div></div></div>';
}

/* A product category, in the same shape every time so reps learn the pattern. */
function blkCat(c){
  var row=function(k,v){ return v?('<div class="cat-r"><span>'+k+'</span><div>'+v+'</div></div>'):''; };
  return '<div class="blk"><div class="cat">'+
    '<div class="cat-n">'+esc(c.name)+'</div>'+
    row('What is it', esc(c.what))+
    row('Who buys it', esc(c.who))+
    row('What to ask', esc(c.ask))+
    row('How to present', esc(c.sell))+
    row('Cross-sell', esc(c.cross))+
    row('Common objection', esc(c.obj))+
  '</div></div>';
}

/* Tiered rows — used for discount authority. Never colour alone: every row
   carries a word and a symbol, so it still reads on a mono screen or to
   somebody who cannot distinguish the colours. */
function blkStatus(rows){
  var mark={g:'&#10003;',y:'!',r:'&#10005;'};
  return '<div class="blk">'+rows.map(function(r){
    return '<div class="st st-'+r[2]+'"><span class="st-m">'+mark[r[2]]+'</span>'+
      '<span class="st-b"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></span></div>';
  }).join('')+'</div>';
}

/* A link out — catalog, invoice, a toolkit page. */
function blkLink(v){
  // A '#name' href is an internal view, not an anchor on the page. Treating it
  // as an anchor left the rep looking at a URL that did nothing.
  if(v.href.charAt(0)==='#'){
    return '<div class="blk"><button class="btn" onclick="go({name:\''+
      (v.href.slice(1)==='closed'?'closed':'kit')+'\',id:\''+v.href.slice(1)+'\'})">'+
      esc(v.label)+'</button></div>';
  }
  var ext=v.href.charAt(0)==='/';
  return '<div class="blk"><a class="btn" href="'+esc(v.href)+'"'+
    (ext?' target="_blank" rel="noopener"':'')+'>'+esc(v.label)+(ext?' &#8599;':'')+'</a></div>';
}

/* The payment-confirmed notice, shown as the thing they will actually receive. */
function blkNotify(lines){
  return '<div class="blk"><div class="notify">'+
    '<div class="notify-h">'+esc(lines[0])+'</div>'+
    lines.slice(1).map(function(l){ return '<div>'+esc(l)+'</div>'; }).join('')+
  '</div></div>';
}

/* Objection cards. Response hidden until tapped, so the rep has to think
   about their own answer first — which is the only way this sticks. */
var CARDS={};
function blkCards(list){
  return '<div class="blk">'+list.map(function(c,i){
    var id='c'+Math.random().toString(36).slice(2,7)+i;
    CARDS[id]=c;
    return '<div class="card-o" id="'+id+'">'+
      '<button class="card-q" onclick="showCard(\''+id+'\')">'+
        '<span>&ldquo;'+esc(c[0])+'&rdquo;</span><span class="card-x">Show response</span></button>'+
      '<div class="card-a"></div></div>';
  }).join('')+'</div>';
}
function showCard(id){
  var c=CARDS[id], el=document.getElementById(id);
  if(!c||!el||el.dataset.open) return;
  el.dataset.open='1';
  el.querySelector('.card-x').textContent='';
  el.querySelector('.card-a').innerHTML=
    '<div class="script" style="margin:0 0 10px"><div class="script-t">Say this</div>'+
    '<div class="script-q">&ldquo;'+esc(c[1])+'&rdquo;</div></div>'+
    '<div class="why"><b>Why it works. </b>'+esc(c[2])+'</div>';
}

/* The two calculators. 'thc' is the COA formula; 'comm' is commission at the
   signed-in rep's own rate. */
function blkCalc(kind){
  if(kind==='thc'){
    return '<div class="blk"><div class="calc">'+
      '<div class="calc-t">Potential total THC</div>'+
      '<div class="calc-f">(THCa &times; 0.877) + Delta-9 THC</div>'+
      '<div class="calc-row"><label>THCa %</label><input id="cTHCa" type="number" step="0.01" value="27.50" oninput="calcTHC()"></div>'+
      '<div class="calc-row"><label>Delta-9 THC %</label><input id="cD9" type="number" step="0.01" value="0.20" oninput="calcTHC()"></div>'+
      '<div class="calc-out" id="cTHCout"></div></div></div>';
  }
  return '<div class="blk"><div class="calc">'+
    '<div class="calc-t">Commission calculator</div>'+
    '<div class="calc-row"><label>Catalog product subtotal $</label><input id="kSub" type="number" step="0.01" value="1000" oninput="calcComm()"></div>'+
    '<div class="calc-row"><label>Discount % (or negative to sell above)</label><input id="kDisc" type="number" step="0.5" value="0" oninput="calcComm()"></div>'+
    '<div class="calc-row"><label>Shipping $ <span class="calc-n">not commissionable</span></label><input id="kShip" type="number" step="0.01" value="0" oninput="calcComm()"></div>'+
    '<div class="calc-out" id="kOut"></div></div></div>';
}
function calcTHC(){
  var a=parseFloat((document.getElementById('cTHCa')||{}).value)||0;
  var d=parseFloat((document.getElementById('cD9')||{}).value)||0;
  var t=a*0.877+d;
  var el=document.getElementById('cTHCout'); if(!el) return;
  el.innerHTML='<div class="calc-sum">'+a.toFixed(2)+' &times; 0.877 = '+(a*0.877).toFixed(4)+
    '<br>+ '+d.toFixed(2)+'</div>'+
    '<div class="calc-big">'+t.toFixed(2)+'%</div>'+
    '<div class="calc-n">potential total THC &mdash; a potency figure, not a legal clearance</div>';
}
function calcComm(){
  var sub=parseFloat((document.getElementById('kSub')||{}).value)||0;
  var disc=parseFloat((document.getElementById('kDisc')||{}).value)||0;
  var ship=parseFloat((document.getElementById('kShip')||{}).value)||0;
  var rate=(ME&&ME.commissionPct)?ME.commissionPct:10;
  var actual=Math.round(sub*(1-disc/100)*100)/100;
  var comm=Math.round(actual*(rate/100)*100)/100;
  var el=document.getElementById('kOut'); if(!el) return;
  var warn = disc>5
    ? '<div class="calc-warn">A discount over 5% needs Scott\'s approval before you promise it.</div>'
    : (disc<0 ? '<div class="calc-ok">Selling above catalog &mdash; your commission goes up with it.</div>' : '');
  el.innerHTML=warn+
    '<div class="calc-sum">Actual product subtotal <b>$'+actual.toLocaleString('en-US',{minimumFractionDigits:2})+'</b>'+
    (ship?('<br>Shipping $'+ship.toFixed(2)+' &mdash; excluded'):'')+
    '<br>Your rate '+rate+'%</div>'+
    '<div class="calc-big">$'+comm.toLocaleString('en-US',{minimumFractionDigits:2})+'</div>'+
    '<div class="calc-n">commission, on product only</div>';
}
</script>

/* ── TOOLKIT PAGES ───────────────────────────────────────────── */
function kitHTML(id){
  var L=levels();
  function grab(lvId, pick){
    var l=L.filter(function(x){ return x.id===lvId; })[0];
    if(!l) return [];
    var out=[];
    l.lessons.forEach(function(ls){ ls.blocks.forEach(function(b){ if(pick(b)) out.push(b); }); });
    return out;
  }
  var body='', title='';

  if(id==='script'){
    title='Call script';
    // Pulled from the levels themselves, so the toolkit can never drift from
    // what the training actually teaches.
    body=grab('L7',function(b){ return b.t==='script'; }).map(function(b){ return blkScript(b.v); }).join('')+
         grab('L12',function(b){ return b.t==='script'; }).map(function(b){ return blkScript(b.v); }).join('')+
         grab('L7',function(b){ return b.t==='bullets'; }).map(function(b){ return block(b); }).join('');
  }

  if(id==='coa'){
    title='COA cheat sheet';
    body=grab('L3',function(b){ return b.t==='steps'||b.t==='calc'||b.t==='bullets'; })
           .map(function(b){ return block(b); }).join('');

  if(id==='calc'){

              'Quote','Order','Reorder','Notes'];

      'are <b>Next action</b> and <b>Next action date</b> — a lead without them disappears.</p></div>'+

      cols.join('\t')+'</textarea></div>'+
      '<div class="blk"><ul>'+cols.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul></div>';
  }
  if(id==='compliance'){

           .map(function(b){ return block(b); }).join('');

<script>
/* ── THE FEDERAL CHANGE ──────────────────────────────────────── */
function blkFed(){

  if(!F) return '';
  return '<div class="blk"><div class="fed">'+

    'If a customer asks about the change, say it is being worked through and get them a '+

/* ── THE ANNOTATED COA ───────────────────────────────────────── */
function blkCOA(){
  var C=(typeof COA_DEMO!=='undefined')?COA_DEMO:null;
  if(!C) return '';
  return '<div class="blk"><div class="coa">'+
    '<div class="coa-h"><b>'+esc(C.title)+'</b>'+
      '<span>Sample '+esc(C.sampleId)+' &middot; '+esc(C.matrix)+'</span>'+
      '<span>Analysed '+esc(C.analyzed)+' &middot; reported '+esc(C.reported)+'</span>'+
      '<span>'+esc(C.accred)+'</span></div>'+
    '<div class="coa-b">'+C.rows.map(function(r){
      return '<div class="coa-r'+(r[4]==='k'?' key':'')+'">'+
        '<div class="coa-n"><b>'+r[0]+'</b>'+(r[1]?('<span>'+r[1]+'</span>'):'')+'</div>'+
        '<div class="coa-v">'+r[2]+(r[3]&&r[3]!=='&mdash;'?('<span>'+r[3]+'</span>'):'')+'</div>'+
        (r[5]?('<div class="coa-note">'+r[5]+'</div>'):'')+
      '</div>'; }).join('')+'</div>'+
    '<div class="coa-miss"><b>Not on this report</b>'+
      C.missing.map(function(m){ return '<span>'+esc(m)+'</span>'; }).join('')+
      '<div class="coa-note" style="margin-top:8px">This is a <b>potency</b> COA. Never tell a '+
      'customer it shows the product is clean of any of the above &mdash; those panels are not here.</div>'+
    '</div></div></div>';
}

/* ── THE FINAL TEST ──────────────────────────────────────────── */
var FSTATE={};
function finalHTML(){
  var F=(typeof FINAL_TEST!=='undefined')?FINAL_TEST:null;
  if(!F) return '<div class="none">The final test is not in the content file.</div>';
  var L=levels(), ready=L.filter(lvDone).length===L.length;
  var need=Math.ceil(F.q.length*F.pass/100);
  return '<div class="lesson"><div class="crumb">Final certification test</div>'+
    '<h2>Thirty questions</h2>'+
    '<div class="blk"><p style="color:var(--muted)">Drawn from every level. You need <b>'+
      F.pass+'%</b> to pass &mdash; that is <b>'+need+' of '+F.q.length+'</b>. '+
      'Retake it as often as you like.</p></div>'+
    (ready?'':'<div class="box rate"><div class="box-t">Levels not finished</div>'+
      'You can sit this now, but it covers material from levels you have not read yet.</div>')+
    F.q.map(function(q,i){
      return '<div class="q" id="f'+i+'"><div class="q-t">'+(i+1)+' of '+F.q.length+'</div>'+
        '<div class="q-q">'+q.q+'</div>'+
        q.a.map(function(a,k){
          return '<button class="opt" onclick="fpick('+i+','+k+')">'+
            '<span class="mk">'+'ABCDEF'.charAt(k)+'</span>'+a+'</button>'; }).join('')+
        '<div class="whyslot"></div></div>';
    }).join('')+
    '<div id="fresult"></div>'+
    '<div class="nav"><button class="btn ghost" onclick="go({name:\'cert\'})">Back</button>'+
    '<button class="btn" id="fdone" disabled onclick="ffinish()">Finish</button></div></div>';
}
function fpick(i,k){
  if(FSTATE[i]!==undefined) return;
  var F=FINAL_TEST, q=F.q[i], el=document.getElementById('f'+i);
  FSTATE[i]=k;
  var opts=el.querySelectorAll('.opt');
  for(var n=0;n<opts.length;n++){
    opts[n].disabled=true;
    if(n===q.right) opts[n].classList.add('right');
    else if(n===k)  opts[n].classList.add('wrong');
  }
  el.querySelector('.whyslot').innerHTML='<div class="why"><b>'+
    (k===q.right?'Correct. ':'Not quite. ')+'</b>'+q.why+'</div>';
  if(Object.keys(FSTATE).length===F.q.length){
    document.getElementById('fdone').disabled=false;
    var sc=fscore(), pass=sc>=F.pass;
    document.getElementById('fresult').innerHTML=
      '<div class="box '+(pass?'rem':'nev')+'" style="margin-top:18px">'+
      '<div class="box-t">'+(pass?'Passed':'Not this time')+'</div>'+
      '<b style="font-family:var(--orb);font-size:26px">'+sc+'%</b> &mdash; '+
      (pass?'that is your certification. Press Finish to record it.'
           :'you need '+F.pass+'%. Press Finish to save the attempt, then read back '+
            'through the levels you slipped on. There is no limit on retakes.')+'</div>';
  }
}
function fscore(){
  var F=FINAL_TEST, right=0;
  F.q.forEach(function(q,i){ if(FSTATE[i]===q.right) right++; });
  return Math.round(right/F.q.length*100);
}
function ffinish(){
  var sc=fscore(), pass=sc>=FINAL_TEST.pass;
  var b=document.getElementById('fdone'); b.disabled=true; b.textContent='Saving…';
  call('trainSave', { moduleId:'FINAL', status:(pass?'complete':'failed'), score:sc },
    function(r){
      if(!r||!r.ok){ b.disabled=false; b.textContent='Finish';
        return toast(r&&r.msg?r.msg:'Could not save. Your answers are still on screen.'); }
      ROWS=r.rows||ROWS;
      toast(pass?('Certified — '+sc+'%'):('Attempt saved — '+sc+'%'));
      FSTATE={}; go({name:'cert'});
    },
    function(){ b.disabled=false; b.textContent='Finish';
      toast('Could not reach the server — nothing was saved. Press Finish again.'); });
}
function finalPassed(){ var r=ROWS['FINAL']; return !!(r && r.status==='complete'); }
</script>

<script>
/* ── THE TWO TESTS ───────────────────────────────────────────
   The distinction reps get wrong most often, laid out side by side. */
function blkTests(){
  return '<div class="blk"><div class="tests">'+
    '<div class="tst tst-now"><div class="tst-h">Delta-9 THC only</div>'+
      '<div class="tst-s">The current federal test</div>'+
      '<div class="tst-b">Hemp is defined as no more than <b>0.3% delta-9 THC</b> on a dry-weight '+
      'basis. THCa is <b>not counted</b> in that figure. This is the whole reason high-THCa flower '+
      'reached the hemp market at all.</div></div>'+
    '<div class="tst tst-next"><div class="tst-h">Total THC</div>'+
      '<div class="tst-s">Potency now · the standard in several states · where federal is heading</div>'+
      '<div class="tst-b"><b>(THCa &times; 0.877) + delta-9</b>. It tells you how strong the flower '+
      'actually is once heated. Several states already test this way, and the federal definition is '+
      'moving toward it.</div></div>'+
  '</div></div>';
}

/* ── UNIT CONVERSION ─────────────────────────────────────────
   The factor-of-ten error, made impossible to make. */
function blkUnits(){
  return '<div class="blk"><div class="calc">'+
    '<div class="calc-t">mg/g &harr; percent</div>'+
    '<div class="calc-f">1,000 mg/g = 100% &nbsp;&middot;&nbsp; divide by 10</div>'+
    '<div class="calc-row"><label>mg/g on the report</label>'+
      '<input id="uMg" type="number" step="0.1" value="375.69" oninput="calcUnits()"></div>'+
    '<div class="calc-out" id="uOut"></div>'+
    '<div class="calc-n" style="margin-top:10px">Quick ones worth knowing by heart: '+
      '1&nbsp;mg/g = 0.1% &middot; 3&nbsp;mg/g = 0.3% (the federal line) &middot; '+
      '100&nbsp;mg/g = 10% &middot; 300&nbsp;mg/g = 30%</div>'+
  '</div></div>';
}
function calcUnits(){
  var m=parseFloat((document.getElementById('uMg')||{}).value)||0;
  var el=document.getElementById('uOut'); if(!el) return;
  el.innerHTML='<div class="calc-big">'+(m/10).toFixed(2)+'%</div>'+
    '<div class="calc-n">'+m.toFixed(2)+' mg/g &divide; 10</div>';
}

/* ── THE CANNABINOID TABLE ───────────────────────────────── */
function blkCann(rows){
  return '<div class="blk">'+rows.map(function(r){
    return '<div class="cn"><div class="cn-h"><b>'+r[0]+'</b>'+
      (r[1]&&r[1]!=='&mdash;'?('<span>'+r[1]+'</span>'):'')+'</div>'+
      '<div class="cn-w">'+r[2]+'</div>'+
      '<div class="cn-u"><span>Where you meet it</span>'+r[3]+'</div></div>';
  }).join('')+'</div>';
}
